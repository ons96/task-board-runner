name: Runner Self-Test

on:
  push:
    paths:
      - 'scripts/**'
      - '.github/workflows/**'
      - 'docs/**'
  pull_request:
    paths:
      - 'scripts/**'
      - '.github/workflows/**'
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  self-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Shell syntax check
        run: |
          bash -n scripts/claim-task.sh
          bash -n scripts/verify-work.sh
          bash -n scripts/check-merge-policy.sh
          echo "shell syntax OK"

      - name: Verify-gate false-done cases
        run: bash scripts/verify-work.sh --self-test

      - name: Merge policy checks
        run: |
          bash scripts/check-merge-policy.sh
          bash scripts/check-merge-policy.sh --self-test

      - name: Workflow YAML validation
        run: |
          python3 -c "import yaml,glob; [yaml.safe_load(open(f)) for f in glob.glob('.github/workflows/*.yml')]; print('YAML OK')"
