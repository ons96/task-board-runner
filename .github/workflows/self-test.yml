name: Runner Self-Test

on:
  push:
    paths:
      - 'scripts/**'
      - '.github/workflows/**'
  pull_request:
    paths:
      - 'scripts/**'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  self-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Checkout runner repository
        uses: actions/checkout@v4
        with:
          path: runner

      - name: Shell syntax check
        run: |
          bash -n scripts/claim-task.sh
          bash -n scripts/verify-work.sh
          bash -n runner/scripts/provider-failure.sh
          python3 -m py_compile runner/scripts/provider-manifest.py
          bash -n scripts/retry-budget.sh
          bash -n scripts/failure-taxonomy.sh
          bash -n scripts/lock-lease.sh
          bash -n scripts/claim-task.sh
          bash -n scripts/merge-policy.sh
          echo "shell syntax OK"

      - name: Provider manifest validation
        run: python3 runner/scripts/provider-manifest.py --self-test

      - name: Provider failure classification
        run: bash runner/scripts/provider-failure.sh --self-test

      - name: Verify-gate false-done cases
        run: bash scripts/verify-work.sh --self-test

      - name: Retry budget
        run: bash scripts/retry-budget.sh --self-test

      - name: Failure taxonomy
        run: bash scripts/failure-taxonomy.sh --self-test

      - name: Lock leases
        run: bash scripts/lock-lease.sh --self-test

      - name: Merge policy
        run: bash scripts/merge-policy.sh --self-test

      - name: Approved providers exist in runner config
        run: |
          python3 - <<'PY'
          import json
          cfg = json.load(open('.github/runner-config.json'))['provider']
          pol = json.load(open('config/providers.json'))['providers']
          bad = []
          for p in pol:
              if not p.get('enabled') or p.get('tier') != 'approved':
                  continue
              prov, _, model = p['model'].partition('/')
              if model not in cfg.get(prov, {}).get('models', {}):
                  bad.append(p['model'])
          assert not bad, f"approved providers missing from runner-config.json: {bad}"
          print('providers OK')
          PY

      - name: Workflow YAML validation
        run: |
          python3 -c "import yaml,glob; [yaml.safe_load(open(f)) for f in glob.glob('.github/workflows/*.yml')]; print('YAML OK')"
